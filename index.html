/* Telita de Mistra — mesa de juego de noche: figura a la izquierda, pestañas a la derecha; en celular, barra de pestañas abajo */
:root{
  --bg:#14121a; --panel:#1d1a25; --panel2:#262231; --line:#3a3446;
  --bone:#ebe2cf; --muted:#a59d8c; --crimson:#c2343c; --arcane:#4fb3ff; --gold:#d9a845;
  --ok:#5bbf7a; --ink:#0d0c11;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.4;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:40px;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],input[type=number],input:not([type]),textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
input[type=color]{width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* encabezado */
header{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.nm{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.nm .t{min-width:0}
.nm h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.05;overflow-wrap:anywhere}
.nm .sub{color:var(--muted);font-size:.9rem}
.nm input{font-family:var(--display);font-size:1.2rem}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn.danger{color:#ff8b8b}
.btn.fight{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;padding:0;font-size:1.2rem}
.use{background:var(--bone);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;white-space:nowrap}
.use:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.hint{color:var(--muted);font-size:.84rem;margin:0}
.ex{font-size:.72rem;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 7px;opacity:.85}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.lbl{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl.inline{flex-direction:row;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}

/* estructura */
.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:14px;align-items:start}
.figcol{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:9px 4px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--bone);color:var(--ink)}
.tabs [data-m]{display:none}
.pane{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;flex-direction:column;gap:10px;min-width:0}
.pane.active{display:flex}
.pane h2,.figcol h2{font-family:var(--display);font-size:1.3rem;margin:4px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane h3,.figcol h3{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec+.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* figura */
.stage{position:relative;aspect-ratio:2/3;width:100%;max-width:min(100%,calc((100vh - 120px) * 2 / 3));margin:0 auto;border-radius:14px;overflow:hidden;flex:none;
  background:radial-gradient(ellipse at 50% 60%,#2a2536 0%,var(--bg) 70%);border:1px solid var(--line)}
.aura{position:absolute;inset:10% 12%;border-radius:50%;filter:blur(30px);opacity:0;transition:opacity .6s}
.figure{position:absolute;inset:0;transition:filter .5s}
.figure.swap{animation:swapin .45s ease-out}
@keyframes swapin{from{opacity:0;transform:scale(.97)}}
.figure img,.mfill{position:absolute;inset:0;width:100%;height:100%}
.figure img{object-fit:contain}
.mfill{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;transition:opacity .5s}
.glow{position:absolute;inset:0;pointer-events:none}
.glow.pulse{animation:pulseW 2.4s ease-in-out infinite}
@keyframes pulseW{50%{opacity:.62}}
@keyframes fxUp{from{background-position:50% 100%}to{background-position:50% 0%}}
@keyframes fxDown{from{background-position:50% 0%}to{background-position:50% 100%}}
@keyframes fxFlick{0%,100%{opacity:var(--o)}35%{opacity:calc(var(--o) * .72)}65%{opacity:calc(var(--o) * .9)}}
@keyframes fxShine{from{background-position:120% 0}to{background-position:-20% 0}}
@keyframes fxZap{0%{opacity:var(--o);background-position:0 0,0 0}25%{opacity:.25;background-position:40% 20%,0 0}50%{opacity:var(--o);background-position:70% 60%,0 0}75%{opacity:calc(var(--o) * .5);background-position:20% 90%,0 0}100%{opacity:var(--o);background-position:0 0,0 0}}
@keyframes fxDrift{from{background-position:0% 0%}to{background-position:100% 100%}}
@keyframes fxHue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes pulse{50%{filter:brightness(1.35);opacity:.7}}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
.placeholder svg{width:45%;opacity:.35}
.wound{position:absolute;inset:0;pointer-events:none;transition:opacity .5s;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,10,20,.65) 100%)}
.seal{position:absolute;left:50%;top:30%;translate:-50% 0;width:46%;aspect-ratio:1;pointer-events:none;opacity:.85}
.badges{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px}
.badge{background:rgba(13,12,17,.82);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.78rem;font-weight:700}
.badge.red{border-color:var(--crimson);color:#ff9a9a}
.badge.blue{border-color:var(--arcane);color:#9bd4ff}
.badge.gold{border-color:var(--gold);color:var(--gold)}
.stage.sway .figure{animation:sway 1.8s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-2deg) translateX(-1%)}75%{transform:rotate(2deg) translateX(1%)}}
.stage.gris .figure{filter:grayscale(1) brightness(.5)}
.stage.oscuro .figure{filter:brightness(.45) saturate(.6)}
.stage.sello .glow:not(.med){opacity:.15}
@media (prefers-reduced-motion:reduce){.glow.pulse,.mfill,.stage.sway .figure,.figure.swap{animation:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 11px;font-size:.88rem;font-weight:600}
.chip.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.chip.pose.on{background:var(--bone);border-color:var(--bone);color:var(--ink)}

/* vida y estadísticas */
.hpbar{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.hpnum{font-family:var(--display);font-size:1.45rem;line-height:1;white-space:nowrap}
.hpnum small{font-size:.85rem;color:var(--muted)}
.meter{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),#e0605a);transition:width .4s}
.hpctl{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.hpctl input{flex:1;text-align:center}
.hpctl .dmg{background:var(--crimson);border-color:var(--crimson);color:#fff}
.hpctl .heal{background:#2f6b47;border-color:#2f6b47;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:4px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stat .lab{font-size:.62rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .mod{font-family:var(--display);font-size:1.25rem;line-height:1.1}

/* tarjetas y listas */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .t{font-weight:700;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.card .d{color:var(--muted);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cost{font-size:.78rem;color:var(--gold);white-space:nowrap}
.tag{font-size:.72rem;font-weight:600;color:var(--gold);border:1px solid rgba(217,168,69,.5);border-radius:99px;padding:0 7px;white-space:nowrap;vertical-align:middle}
.tag.blue{color:#9bd4ff;border-color:rgba(79,179,255,.5)}
.card.flash{animation:flash .5s}
@keyframes flash{0%{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:.9rem}
.mini{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.mini>span:first-child{font-weight:600;min-width:0;overflow-wrap:anywhere}
.grp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.grp>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp>.gh .gt{font-family:var(--display);font-size:1.15rem}
details.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";color:var(--muted)}
details.grp[open]>summary::after{content:"▴"}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.res .rn{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--arcane);background:var(--arcane);padding:0}
.pip.used{background:transparent;opacity:.55}

/* combate */
.turn{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--crimson);border-radius:12px;padding:10px 12px}
.bignum{font-family:var(--display);font-size:2.4rem;line-height:1}
.marks{background:linear-gradient(135deg,rgba(194,52,60,.18),var(--panel2));border:1px solid var(--crimson);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mk-pips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:60%}
.mk-pips i{width:11px;height:11px;transform:rotate(45deg);background:var(--crimson);box-shadow:0 0 6px var(--crimson)}
.fxdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);margin-right:7px}
.death{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.85rem}
.death .pp{display:flex;gap:6px}
.dp{width:20px;height:20px;border-radius:50%;border:2px solid var(--ok);background:none;padding:0}
.dp.on{background:var(--ok)}
.dp.f{border-color:var(--crimson)}.dp.f.on{background:var(--crimson)}
.cp-m{display:none}

/* medidores */
.mbar{height:12px;border-radius:99px;position:relative;border:1px solid var(--line)}
.mbar i{position:absolute;top:-4px;width:4px;height:18px;background:var(--gold);border-radius:2px;translate:-2px 0;transition:left .3s}
.mbar b{position:absolute;top:-3px;width:1px;height:16px;background:var(--gold);opacity:.55}
.mval{font-family:var(--display);font-size:1.15rem;text-align:center}
.thr{font-size:.85rem;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.thr.on{border-color:var(--gold);color:var(--bone);background:rgba(217,168,69,.12)}

/* hoja */
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;align-items:start}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vit .box{align-items:center;text-align:center;gap:2px;padding:8px 4px}
.vit .n{font-family:var(--display);font-size:1.4rem;line-height:1.1;overflow-wrap:anywhere}
.vit .l{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sk{display:grid;grid-template-columns:22px 2.6em 1fr auto;gap:8px;align-items:center;padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.04)}
.sk .v{font-weight:700;text-align:right}
.sk .a{font-size:.72rem;color:var(--muted)}
.skedit{display:grid;grid-template-columns:minmax(0,1fr) 4.4em 3.8em auto;gap:6px;align-items:center;padding:3px 0}
.prof{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0}
.prof.p1{background:var(--bone);border-color:var(--bone)}
.prof.p2{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 2px var(--panel2),0 0 0 3.5px var(--gold)}
.pre{white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
.insp{border:2px solid var(--gold);color:var(--gold);background:none;border-radius:8px;padding:6px 10px;font-weight:700}
.insp.on{background:var(--gold);color:var(--ink)}

/* árbol (cuerpo y notas) */
.tree{display:flex;flex-direction:column;gap:4px}
.nd{display:flex;flex-direction:column;gap:4px}
.nd-h{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-width:0}
.nd-h .tg{background:none;border:0;padding:0 4px;color:var(--muted);font-size:.9rem;width:22px;flex:none}
.nd-h .nt{flex:1;min-width:0;font-weight:600;background:none;border:0;text-align:left;padding:2px 0;overflow-wrap:anywhere}
.nd-h .cnt{font-size:.75rem;color:var(--muted)}
.nd-k{margin-left:14px;padding-left:10px;border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.nd-b{margin-left:14px;padding:8px 10px;border-left:2px solid var(--gold);display:flex;flex-direction:column;gap:6px}
mark{background:rgba(217,168,69,.4);color:inherit;border-radius:3px;padding:0 2px}
.crumb{font-size:.75rem;color:var(--muted)}
.search{display:flex;gap:6px;align-items:center}
.search input{font-size:1rem;padding:9px 12px}

/* poses y pintura */
.poses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pcard.cur{border-color:var(--gold)}
.thumb{aspect-ratio:2/3;border-radius:8px;background:var(--bg) center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center}
.paint{position:fixed;inset:0;z-index:40;background:rgba(10,9,13,.96);display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.paint .pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.paint .box2{position:relative;height:100%;max-width:100%;aspect-ratio:var(--ar)}
.paint .box2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.9}
.paint canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;opacity:.75}
.paint .row{row-gap:6px}
.colorrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw.on{border-color:var(--bone)}

/* menú y personajes */
.drawer{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:flex}
.drawer .dp2{background:var(--panel);width:min(330px,88vw);height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;overflow:auto;border-right:1px solid var(--line)}
.drawer .btn{text-align:left}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);color:var(--gold);letter-spacing:.1em;font-size:1.05rem}
.brand svg{width:34px;height:34px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.ccard .thumb{width:72px}
.log{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--bone);color:var(--ink);padding:9px 16px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:899px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .layout{grid-template-columns:1fr}
  .figcol{position:static;max-height:none;display:none;padding:0;border:0;background:none}
  .figcol.active{display:flex}
  .stage{max-width:min(100%,calc((100svh - 170px) * 2 / 3))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;border-width:1px 0 0;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));gap:2px}
  .tabs [data-m]{display:block}
  nav.tabs [data-w]{display:none}
  .tabs button{font-size:.78rem;padding:10px 1px}
  .figcol .cp-m{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .nm h1{font-size:1.35rem}
  .pane{padding:10px}
}

#inst{top:auto!important;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (max-width:899px){#inst{bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}}
.bgimg{position:absolute;inset:0;background:center/cover no-repeat}
.bgdim{position:absolute;inset:0;background:#000;pointer-events:none}
.bgthumb{aspect-ratio:16/10;border-radius:10px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
details.ai>summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none}
details.ai>summary::-webkit-details-marker{display:none}
details.ai>summary::before{content:"▸ ";color:var(--gold)}
details.ai[open]>summary::before{content:"▾ "}
.stylegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.stl{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:.82rem;font-weight:600;text-align:left}
.stl.on{border-color:var(--gold);background:rgba(217,168,69,.14)}
.stl i{width:20px;height:20px;border-radius:50%;flex:none}
.tmpn{font-size:.9rem;color:#7fd4ff;margin-left:4px}
.meter.tmpm{height:7px}.meter.tmpm i{background:linear-gradient(90deg,#3b8fd9,#9be7ff);box-shadow:0 0 6px #4fb3ff}
.hpctl .tmpb{background:#1f4a6e;border-color:#3b8fd9;color:#cfeaff;white-space:nowrap;padding-inline:9px}
@media (max-width:420px){.hpctl{flex-wrap:wrap}.hpctl input{flex:1 1 60px}}

/* capas */
.figure img.capa,.stage.adj img.capa{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:50% 50%}
.chip.tog{display:inline-flex;align-items:center;gap:2px;opacity:.75}
.chip.tog.lit{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel2));box-shadow:0 0 10px -2px var(--c)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.chip.tog.lit{background:var(--panel2)}}
/* fotos en notas */
.nimgs{display:flex;flex-wrap:wrap;gap:6px}
.nimg{width:72px;height:72px;border-radius:9px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;padding:0;cursor:pointer}
.nimg.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:1.2rem;border-style:dashed}
.nimg.add span{font-size:.72rem}
/* calculadora */
.dicefab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a3146,var(--panel));color:var(--gold);display:grid;place-items:center;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 3px rgba(217,168,69,.15)}
.dicefab svg{width:100%;height:100%}
.dicefab:active{transform:scale(.94)}
.dsheet{position:fixed;inset:0;z-index:40;background:rgba(5,4,8,.6);display:flex;align-items:flex-end;justify-content:center}
.dpanel{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:min(560px,100%);max-height:92vh;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.drow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.drow .lbl{flex:1;min-width:120px}
.dbig{font-size:1.5rem!important;text-align:center;font-family:var(--display)}
.dtotal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.dtotal b{font-family:var(--display);font-size:2.6rem;line-height:1}
.dtotal em{font-style:normal;font-weight:700;color:var(--muted)}
.dtotal.crit{border-color:var(--gold);box-shadow:0 0 18px -4px var(--gold)}.dtotal.crit b,.dtotal.crit em{color:var(--gold)}
.dtotal.fail{border-color:var(--crimson)}.dtotal.fail em{color:#ff8b8b}
/* compendio */
.paint.cmp{overflow:auto}
.cmplist{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0}
.cmprow{text-align:left;color:inherit;cursor:pointer}
.cmpdet{display:flex;flex-direction:column;gap:8px;max-width:760px}
@media (max-width:899px){.dicefab{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}

.modedit{display:grid;grid-template-columns:minmax(0,1.3fr) 5.5em minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
@media (max-width:520px){.modedit{grid-template-columns:minmax(0,1fr) 5.5em auto;}.modedit select{grid-column:span 1}}
.paint .box2 .sublayer{position:absolute;inset:0;pointer-events:none}
.paint .box2 .sublayer canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.paint .box2 .sublayer .mfill{position:absolute;inset:0;width:100%;height:100%;opacity:.95}
.paint .box2 img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.95}
.paint .box2 svg.lasso{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.paint .box2 canvas.fl{position:absolute;inset:0;width:100%;height:100%}
.brush{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;font-size:.82rem;font-weight:600}
.brush.on{border-color:var(--gold);background:rgba(217,168,69,.16)}
.bsw{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block}
.paint .banner{background:rgba(217,168,69,.14);border:1px solid var(--gold);border-radius:10px;padding:7px 10px;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paint .banner[hidden]{display:none}
.paint .brushes{display:flex;flex-direction:column;gap:6px}
/* munición y consumibles */
.rack{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;padding:6px 8px;margin:6px 0;border-radius:8px;background:linear-gradient(#2a2118,#1c1610);border:1px solid #4a3a28;min-height:34px}
.rack.flecha,.rack.dardo{border-radius:8px 8px 18px 18px;background:linear-gradient(90deg,#3a2a1a,#5a3d26 50%,#3a2a1a)}
.rack.mag{background:linear-gradient(#2b2d33,#17181c);border-color:#4a4e58;border-radius:4px}
.rack.pocion,.rack.bomba,.rack.cuchillo{background:linear-gradient(#5a3d26,#3a2a1a);border-top:4px solid #8a6440}
.slot{display:inline-flex;width:16px;height:30px;transition:opacity .3s,transform .3s}
.rack.flecha .slot,.rack.cuchillo .slot{width:10px;height:44px}
.rack.pocion .slot,.rack.bomba .slot{width:24px;height:28px}
.slot svg{width:100%;height:100%}
.slot.used{opacity:.16;filter:grayscale(1);transform:translateY(3px)}
.cons.flash .rack{animation:consPulse .5s}
@keyframes consPulse{50%{box-shadow:0 0 0 3px var(--gold)}}
.grimbtn{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--display);font-size:1.05rem;background:linear-gradient(90deg,#3b2a1a,#262231);border-color:#6a5032}
/* grimorio */
.grim{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#2a2030,#0c0a10);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px))}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.gbtn{background:#3b2a1a;color:#efe3c4;border:1px solid #6a5032;border-radius:8px;padding:7px 12px;font-family:var(--display);font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.gbtn.ghost{background:transparent}
.gbtn:disabled{opacity:.5}
.gpick{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;margin-bottom:8px;background:#1d1a25;border:1px solid var(--line);border-radius:8px}
.book{flex:1;min-height:0;display:flex;position:relative;perspective:1600px;margin-bottom:8px}
.gpage{flex:1;min-width:0;position:relative;overflow:auto;background:#efe3c4;background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(circle at 80% 90%,rgba(120,80,30,.18),transparent 55%);color:#3b2a1a;padding:22px 34px 60px;border-radius:6px;box-shadow:inset 0 0 40px rgba(120,80,30,.35),0 8px 30px rgba(0,0,0,.5);font-family:var(--body)}
.two .gpage:nth-of-type(1){border-radius:8px 2px 2px 8px;box-shadow:inset -18px 0 26px -14px rgba(60,35,10,.55),inset 0 0 40px rgba(120,80,30,.3)}
.two .gpage:nth-of-type(2){border-radius:2px 8px 8px 2px;box-shadow:inset 18px 0 26px -14px rgba(60,35,10,.55),inset 0 0 40px rgba(120,80,30,.3)}
.gpage.blank{background:#e6d8b6}
.geyebrow{font-family:var(--display);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#8a6440}
.gtitle{font-family:var(--display);font-size:1.7rem;line-height:1.1;margin:2px 0 8px;text-wrap:balance;color:#2a1b0e}
.gtitle::first-letter{color:#8e1f26;font-size:1.25em}
.gsub{font-family:var(--display);color:#8a6440;margin-bottom:6px;border-bottom:1px solid #c9b48a;padding-bottom:4px}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gtags span{border:1px solid #b89b6a;border-radius:20px;padding:1px 9px;font-size:.8rem;background:rgba(255,255,255,.3)}
.gimg{display:block;max-width:100%;max-height:34vh;margin:6px auto 10px;border-radius:4px;mix-blend-mode:multiply;filter:sepia(.25)}
.gtext{white-space:pre-wrap;line-height:1.45;font-size:1rem;max-width:62ch}
.gfoot{position:absolute;left:16px;right:16px;bottom:12px;display:flex;justify-content:space-between;gap:8px}
.gpage .gbtn.ghost{color:#3b2a1a;border-color:#b89b6a}
.gnum{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.75rem;color:#8a6440;pointer-events:none}
.gpage.spent .gtitle,.gpage.spent .gtext,.gpage.spent .gimg{filter:grayscale(1);opacity:.55}
.gstamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #8e1f26;color:#8e1f26;font-family:var(--display);font-size:1.4rem;padding:4px 14px;border-radius:6px;opacity:.75;pointer-events:none;text-transform:uppercase;white-space:nowrap}
.gindex{margin:0;padding-left:1.4em;columns:1}
.two .gindex{columns:1}
.gindex li{padding:3px 0;border-bottom:1px dotted #c9b48a;display:flex;justify-content:space-between;gap:8px}
.gindex li button{background:none;border:0;color:#2a1b0e;font-family:var(--display);font-size:1rem;padding:0;text-align:left;cursor:pointer}
.gindex li span{color:#8a6440;font-size:.8rem}
.gindex li.spent button{text-decoration:line-through;opacity:.55}
.gnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:28px;height:56px;border-radius:8px;border:1px solid #6a5032;background:rgba(59,42,26,.7);color:#efe3c4;font-size:1.8rem;cursor:pointer}
.gnav.prev{left:-4px}.gnav.next{right:-4px}
.gnav:disabled{opacity:.2}
.book.turn-next .gpage:last-of-type{animation:gFlipN .45s ease-out}
.book.turn-prev .gpage:first-of-type{animation:gFlipP .45s ease-out}
.one .book.turn-next .gpage,.one .book.turn-prev .gpage{animation-name:gFade}
@keyframes gFlipN{from{transform:rotateY(-70deg);transform-origin:left center;opacity:.4}to{transform:none;transform-origin:left center}}
@keyframes gFlipP{from{transform:rotateY(70deg);transform-origin:right center;opacity:.4}to{transform:none;transform-origin:right center}}
@keyframes gFade{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.book .gpage{animation:none!important}}
/* selector de ambientación */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tema{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-size:.9rem}
.tema.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tsw{width:30px;height:22px;border-radius:5px;display:flex;align-items:flex-end;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.2);flex:none}
.tsw i{flex:1;height:60%;border-radius:2px}
/* ---- ambientaciones ---- */
:root[data-tema=scifi]{--bg:#070d12;--panel:#0c161e;--panel2:#11212c;--line:#1d3a4a;--bone:#d8f3ff;--muted:#7fa3b3;--crimson:#ff3b5c;--arcane:#00e5ff;--gold:#39ffb0;--ok:#39ffb0;--ink:#02080b;--display:"Orbitron","Exo 2",system-ui,sans-serif;--body:"Exo 2",system-ui,sans-serif}
[data-tema=scifi] body{background:var(--bg) linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px) 0 0/100% 4px fixed}
[data-tema=scifi] .btn,[data-tema=scifi] .card,[data-tema=scifi] .sec,[data-tema=scifi] .use,[data-tema=scifi] input,[data-tema=scifi] select,[data-tema=scifi] textarea{border-radius:2px}
[data-tema=scifi] .card{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
[data-tema=scifi] h1,[data-tema=scifi] h2{letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 12px rgba(57,255,176,.35)}
[data-tema=scifi] .use{background:var(--gold);box-shadow:0 0 10px rgba(57,255,176,.4)}
:root[data-tema=steampunk]{--bg:#17110b;--panel:#221810;--panel2:#2e2116;--line:#5a4128;--bone:#f0dfc0;--muted:#b39a78;--crimson:#b8432a;--arcane:#5fb3a8;--gold:#c8893a;--ok:#8fb35a;--ink:#140d06;--display:"IM Fell English SC",Georgia,serif;--body:"Crimson Pro",Georgia,serif}
[data-tema=steampunk] .card,[data-tema=steampunk] .sec{border-color:#7a5a32;box-shadow:inset 0 0 0 2px #1a120a,inset 0 0 0 3px #6a4c2a}
[data-tema=steampunk] .use{background:linear-gradient(#e0b066,#a8702c);color:#1a1006}
[data-tema=steampunk] body{background:var(--bg) radial-gradient(circle at 50% 0,#2a1d10,transparent 70%) fixed}
:root[data-tema=terror]{--bg:#0b0707;--panel:#140d0d;--panel2:#1d1313;--line:#3a2020;--bone:#e3d6d0;--muted:#9a8580;--crimson:#ff2a2a;--arcane:#8a6cff;--gold:#c42020;--ok:#6f9a6a;--ink:#0b0707;--display:"Pirata One",Georgia,serif;--body:"Cormorant Garamond",Georgia,serif}
[data-tema=terror] body{background:var(--bg) radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.75)) fixed;font-size:16.5px}
[data-tema=terror] .btn.on,[data-tema=terror] .use{color:#fff}
[data-tema=terror] .use{background:#7a1010}
[data-tema=terror] h1,[data-tema=terror] h2{text-shadow:0 2px 0 #3a0000}
:root[data-tema=feerico]{--bg:#0b140f;--panel:#122019;--panel2:#1a2c22;--line:#2c4436;--bone:#e6f2dc;--muted:#97ad97;--crimson:#e0577a;--arcane:#c08bff;--gold:#b6e36a;--ok:#7fe0a0;--ink:#0a120c;--display:"Uncial Antiqua",Georgia,serif;--body:"Nunito",system-ui,sans-serif}
[data-tema=feerico] body{background:var(--bg) radial-gradient(circle at 20% 10%,rgba(192,139,255,.10),transparent 40%),radial-gradient(circle at 85% 80%,rgba(182,227,106,.08),transparent 45%) fixed}
[data-tema=feerico] .card,[data-tema=feerico] .btn,[data-tema=feerico] .use{border-radius:14px}
:root[data-tema=pirata]{--bg:#0a141c;--panel:#0f1d28;--panel2:#152836;--line:#26445a;--bone:#f2e6cc;--muted:#9fb0b8;--crimson:#d64545;--arcane:#3fc1c9;--gold:#e0b45c;--ok:#5bbf9a;--ink:#08121a;--display:"Pirata One",Georgia,serif;--body:"Lora",Georgia,serif}
[data-tema=pirata] body{background:var(--bg) linear-gradient(180deg,transparent 60%,rgba(63,193,201,.07)) fixed}
:root[data-tema=moderno]{--bg:#121417;--panel:#1a1d22;--panel2:#23272e;--line:#353b45;--bone:#eef0f3;--muted:#9aa3ae;--crimson:#ff4d6d;--arcane:#4da3ff;--gold:#ffcc33;--ok:#3ddc84;--ink:#111;--display:"Barlow Condensed",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif}
[data-tema=moderno] h1,[data-tema=moderno] h2{text-transform:uppercase;letter-spacing:.03em}
[data-tema=moderno] .card,[data-tema=moderno] .btn,[data-tema=moderno] .use{border-radius:4px}
:root[data-tema=claro]{--bg:#efe6d2;--panel:#f7f0e0;--panel2:#e8dcc2;--line:#c9b48a;--bone:#2a1d10;--muted:#6e5c44;--crimson:#a3262d;--arcane:#1f6fb0;--gold:#8a5a1c;--ok:#3d7a3a;--ink:#fff8ea;color-scheme:light}
[data-tema=claro] .use{background:#3b2a1a;color:#f7f0e0}
/* sonidos */
.sndrow{flex-wrap:nowrap;gap:4px}.sndrow select{flex:1;min-width:0}
.dpanel.snd h2{font-family:var(--display)}
.btn.rec{border-color:var(--crimson)}.btn.rec.on{background:var(--crimson);color:#fff;border-color:var(--crimson);animation:recPulse 1s infinite}
@keyframes recPulse{50%{opacity:.7}}
.wave{width:100%;height:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:ew-resize;margin-top:8px}
.sedit{background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.on .sn{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.btn.rec.on{animation:none}}
/* apariencia por elemento */
.lookp{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lookp .chips{display:flex;flex-wrap:wrap;gap:4px}
.lkprev{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}

  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("telita",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},

  del(k){MEM.delete(k);if(!this.db)return Promise.resolve();return new Promise(res=>{try{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}
};

function migrateOld(c,o){
  try{
    const setIf=(k,v)=>{if(v!==undefined&&v!==null)c[k]=v};
    setIf("nombre",o.nombre);setIf("clase",o.clase);setIf("ca",o.ca);setIf("nivel",o.nivel);setIf("vel",o.vel);setIf("dadosGolpe",o.dadosGolpe);setIf("iniExtra",o.iniExtra);setIf("profOv",o.profOv);setIf("insp",o.insp);
    if(o.muerte)c.muerte=o.muerte;
    if(o.stats)c.stats.forEach(s=>{if(o.stats[s.id]!==undefined)s.v=o.stats[s.id]});
    if(o.hp)c.hp={act:o.hp.act,max:o.hp.max,temp:0};
    if(Array.isArray(o.saves))c.saves=o.saves.map(s=>({id:uid(),n:s.n,a:s.a==="—"?"":s.a,p:s.p||0,x:s.x||0}));
    if(Array.isArray(o.skills))c.skills=o.skills.map(s=>({id:uid(),n:s.n,a:s.a==="—"?"":s.a,p:s.p||0,x:s.x||0}));
    if(Array.isArray(o.datos))c.datos=o.datos.map(d=>({id:uid(),l:d.l,v:d.v}));
    if(Array.isArray(o.notas))c.textos=o.notas.map(n=>({id:uid(),t:n.t,b:n.b}));
    if(Array.isArray(o.ataques))c.armas=o.ataques.map(a=>({id:uid(),n:a.n,b:a.b,d:a.d,notas:"",contador:a.mk?"cMarca":""}));
    if(o.marcas){const m=c.contadores[0];m.v=o.marcas.n||0;if(o.marcas.desc)m.d=o.marcas.desc}
    if(typeof o.balance==="number")c.medidores[0].v=o.balance;
    const colorMap={azul:"#4fb3ff",rojo:"#ff3b3b",blanco:"#fff4dc",violeta:"#b77bff"};
    const tatMap={brazoDer:"eBD",pecho:"ePe",abdomen:"eAb",brazoIzq:"eBI"};
    if(Array.isArray(o.tat))o.tat.forEach(t=>{
      let e=c.efectos.find(x=>x.id===tatMap[t.id]);
      if(!e){e=Object.assign(TPL("efecto"),{id:t.id});c.efectos.push(e)}
      e.n=t.nombre||e.n;e.c=colorMap[t.color]||e.c;e.on=!!t.on;e.dur=t.dur||0;e.left=t.left||0;if(t.desc)e.desc=t.desc;
    });
    const gMag=c.grupos[0],gMala=c.grupos[1],gDot=c.grupos[2],gArm=c.grupos[3];
    if(o.pool){const r=c.recursos.find(r=>r.id==="rMan");r.n=o.pool.nombre||r.n;r.max=o.pool.max;r.act=o.pool.act}
    if(o.slots){c.recursos=c.recursos.filter(r=>r.id!=="rEsp1");Object.entries(o.slots).forEach(([lv,s])=>{if(s.max>0)c.recursos.push({id:"rEsp"+lv,n:"Espacios de conjuro nivel "+lv,act:s.max-s.used,max:s.max,rec:"largo"})})}
    const tatEff=id=>tatMap[id]||id||"";
    if(Array.isArray(o.conj))gMag.items=o.conj.map(x=>({id:uid(),n:x.n,d:x.d||"",usos:{act:0,max:0},rec:"largo",recurso:x.lv>0?"rEsp"+x.lv:"",costo:1,dur:x.dur||0,efecto:""}));
    if(Array.isArray(o.mala))gMala.items=o.mala.map(x=>({id:uid(),n:x.n,d:x.d||"",usos:{act:x.act||0,max:x.max||0},rec:"largo",recurso:"",costo:1,dur:x.dur||0,efecto:x.tat?tatEff(x.tat):""}));
    if(Array.isArray(o.dotes))gDot.items=o.dotes.map(x=>({id:uid(),n:x.n,d:x.d||"",usos:{act:0,max:0},rec:"largo",recurso:x.cost?"rMan":"",costo:x.cost||1,dur:x.dur||0,efecto:""}));
    if(Array.isArray(o.arma))gArm.items=o.arma.map(x=>({id:uid(),n:x.n,d:x.d||"",usos:{act:x.act||0,max:x.max||0},rec:"largo",recurso:"",costo:1,dur:x.dur||0,efecto:""}));
    if(Array.isArray(o.dim))c.inventarios[0].items=o.dim.map(x=>({id:uid(),n:x.n,donde:x.z||"",d:x.d||""}));
    const st=c.estados;if(o.aturdido)st[0].on=true;if(o.ko)st[1].on=true;if(o.sellado)st[2].on=true;
    if(o.combate){c.combate=true;c.turno=o.turno||1;c.pose=o.postura==="defensa"?"pD":"pA";c.lastCombat=c.pose}
    if(Array.isArray(o.efectos))c.tempFx=o.efectos.map(e=>({id:uid(),n:e.n,left:e.left,d:e.d||e.left}));
    if(Array.isArray(o.log))c.log=o.log.slice(0,40);
  }catch(e){console.warn("migración parcial",e)}
}

function hlText(text,q){
  text=String(text||"");if(!q)return esc(text);
  let n="",map=[];for(let i=0;i<text.length;i++){const c=nchar(text[i]);for(const ch of c){n+=ch;map.push(i)}}
  const qq=norm(q);let out="",last=0,from=0,idx;
  while(qq&&(idx=n.indexOf(qq,from))>=0){const s=map[idx],e=map[idx+qq.length-1]+1;if(s<last){from=idx+1;continue}out+=esc(text.slice(last,s))+"<mark>"+esc(text.slice(s,e))+"</mark>";last=e;from=idx+qq.length}
  return out+esc(text.slice(last));
}

/* ============ efectos visuales ============ */
const ESTILOS=[["brillo","Brillo","#4fb3ff"],["fuego","Fuego","#ff6a00"],["hielo","Hielo / escarcha","#9be7ff"],["electricidad","Electricidad","#7ff6ff"],["humo","Humo","#9a9aa8"],["metal","Metálico / armadura","#c9d1d9"],["sombra","Sombra","#6a2bb8"],["sagrado","Luz sagrada","#ffd36b"],["veneno","Veneno / ácido","#7dff4a"],["sangre","Sangre","#c0121e"],["lava","Lava","#ff3b00"],["cristal","Cristal / arcano","#d08bff"]];
function hx(c){c=String(c||"#ffffff").replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");return[0,2,4].map(k=>parseInt(c.substr(k,2),16)||0)}
function mix(a,b,t){const A=hx(a),B=hx(b);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")}
function styleFill(st,c,c2){
  const L1=mix(c,"#ffffff",.55),L2=mix(c,"#ffffff",.85),D1=mix(c,"#000000",.45),D2=mix(c,"#000000",.75),C2=c2||L1;
  switch(st){
    case "fuego":return{bg:`linear-gradient(0deg,${D1} 0%,${c} 25%,${L1} 50%,${c} 70%,${D1} 85%,${c} 100%)`,size:"100% 300%",anim:"fxUp 1.6s linear infinite, fxFlick .9s steps(3) infinite",g:c};
    case "lava":return{bg:`radial-gradient(circle at 30% 40%,${L1} 0 12%,transparent 22%),radial-gradient(circle at 70% 70%,${L2} 0 8%,transparent 18%),linear-gradient(0deg,${D2},${c} 40%,${D1} 70%,${c})`,size:"60% 60%, 50% 50%, 100% 200%",anim:"fxUp 5s linear infinite",g:c};
    case "hielo":return{bg:`linear-gradient(125deg,${L2} 0%,${c} 22%,#ffffff 30%,${L1} 38%,${c} 55%,#ffffff 62%,${L2} 70%,${c} 100%)`,size:"300% 300%",anim:"fxShine 4.5s linear infinite",g:c};
    case "electricidad":return{bg:`repeating-linear-gradient(115deg,transparent 0 6px,${L2} 6px 8px,transparent 8px 15px),linear-gradient(90deg,${c},#ffffff,${c})`,size:"200% 200%, 100% 100%",anim:"fxZap .7s steps(4) infinite",g:c};
    case "humo":return{bg:`radial-gradient(circle at 20% 30%,${L1} 0,transparent 35%),radial-gradient(circle at 70% 60%,${c} 0,transparent 40%),radial-gradient(circle at 40% 80%,${D1} 0,transparent 45%),${mix(c,"#000000",.2)}`,size:"200% 200%",anim:"fxDrift 9s ease-in-out infinite alternate",g:D1,blur:3,halo:.35};
    case "metal":return{bg:`linear-gradient(115deg,${D1} 0%,${c} 25%,#ffffff 33%,${L1} 38%,${D1} 52%,${c} 70%,${L2} 78%,${D2} 100%)`,size:"250% 100%",anim:"fxShine 3.5s ease-in-out infinite",g:L1,halo:.3,solid:true};
    case "sombra":return{bg:`radial-gradient(circle at 50% 50%,${D2},${D1} 40%,${c} 70%,#000 100%)`,size:"160% 160%",anim:"fxDrift 6s ease-in-out infinite alternate",g:c,blur:1};
    case "sagrado":return{bg:`repeating-conic-gradient(from 0deg at 50% 30%,${L2} 0 6deg,${c} 6deg 14deg),linear-gradient(${L2},${c})`,size:"100% 100%",anim:"fxFlick 2.4s ease-in-out infinite",g:c};
    case "veneno":return{bg:`radial-gradient(circle at 25% 30%,${L1} 0 6%,transparent 9%),radial-gradient(circle at 65% 65%,${L2} 0 5%,transparent 8%),linear-gradient(0deg,${D1},${c},${D1})`,size:"35% 35%, 45% 45%, 100% 200%",anim:"fxUp 3s linear infinite",g:c};
    case "sangre":return{bg:`linear-gradient(180deg,${c} 0%,${D1} 45%,${D2} 100%)`,size:"100% 200%",anim:"fxDown 6s linear infinite",g:D1,halo:.4};
    case "cristal":return{bg:`conic-gradient(from 30deg,${c},${L2},${C2},${D1},${c},${L1},${c})`,size:"100% 100%",anim:"fxHue 6s linear infinite",g:c};
    default:return{bg:c2?`linear-gradient(160deg,${c},${c2})`:c,size:"",anim:"",g:c2||c};
  }
}
function zoneSubs(e){return e.sub&&e.sub.length?e.sub:[{id:"_",estilo:e.estilo||"brillo",c:e.c,c2:e.c2||"",masks:e.masks||{}}]}
const zoneHasPose=(e,pid)=>zoneSubs(e).some(s=>s.masks&&s.masks[pid]);
function medLevel(e){
  const M=C.medidores.find(x=>x.id===e.med.id);if(!M)return null;let t,side;
  if(M.tipo==="bipolar"){if(!M.v)return null;const span=Math.max(Math.abs(M.min),Math.abs(M.max))||1;t=Math.abs(M.v)/span;side=M.v<0?e.med.neg:e.med.pos}
  else{t=(M.v-M.min)/((M.max-M.min)||1);if(t<=0)return null;side=e.med.pos}
  return{t:clamp(t,0,1),side};
}
function effLayer(e,p){
  const subs=zoneSubs(e).filter(s=>s.masks&&s.masks[p.id]&&getImg(s.masks[p.id]));if(!subs.length)return"";
  let ml=null;if(e.med&&e.med.id){ml=medLevel(e);if(!ml)return""}else if(!e.on)return"";
  return subs.map(sb=>{const m=getImg(sb.masks[p.id]);let f,op,r1,r2,pulse;
    if(ml){const a=ml.side[0],b=ml.side[1],t=ml.t;f=sb.estilo&&sb.estilo!=="brillo"?styleFill(sb.estilo,a,b):{bg:b?`linear-gradient(160deg,${a},${b})`:a,g:b||a};op=0.2+0.72*t;r1=1.5+5*t;r2=3+14*t;pulse=t>=1/3}
    else{f=styleFill(sb.estilo||"brillo",sb.c,sb.c2);const h=+e.halo*(f.halo!==undefined?f.halo/.5:1);op=+e.brillo||.9;r1=1+4*h;r2=3+14*h;pulse=e.pulso!==false}
    return`<div class="glow ${pulse?"pulse":""} ${ml?"med":""}" style="filter:drop-shadow(0 0 ${(+r1).toFixed(1)}px ${f.g}) drop-shadow(0 0 ${(+r2).toFixed(1)}px ${f.g})"><div class="mfill" style="--o:${(+op).toFixed(2)};background:${f.bg};${f.size?`background-size:${f.size};`:""}${f.anim?`animation:${f.anim};`:""}${f.blur?`filter:blur(${f.blur}px);`:""}opacity:${(+op).toFixed(2)};-webkit-mask-image:url(${m});mask-image:url(${m})"></div></div>`}).join("");
}

function treeHTML(nodes,base,kind){
  return nodes.map(n=>{const ref=`${base}.${n.id}`,open=!!ui.open[n.id],kids=n.k||[];
    const links=kind==="parte"?C.efectos.filter(e=>e.parte===n.id).length:0;
    return`<div class="nd"><div class="nd-h"><button class="tg" data-a="tog" data-id="${n.id}" aria-label="${open?L("Cerrar"):L("Abrir")}">${kids.length?(open?"▾":"▸"):"•"}</button>
      <button class="nt" data-a="tog" data-id="${n.id}">${esc(n.n)}</button>${links?`<span class="tag">✦ ${links}</span>`:""}${n.d?`<span class="cnt">✎</span>`:""}${kids.length?`<span class="cnt">${kids.length}</span>`:""}</div>
      ${open?`<div class="nd-b"><input ${R(ref,"n")} value="${esc(n.n)}"><textarea ${R(ref,"d")} placeholder="${L("Notas de esta parte: tatuajes, heridas, marcas…")}">${esc(n.d)}</textarea>
        <div class="row"><button class="btn small" data-a="add" data-ref="${ref}.k" data-kind="parte" data-open="${n.id}">+ ${L("Agregar parte dentro")}</button><button class="btn small danger" data-a="del" data-ref="${ref}">${L("Borrar")}</button></div></div>
        ${kids.length?`<div class="nd-k">${treeHTML(kids,ref+".k",kind)}</div>`:""}`:""}</div>`}).join("");
}
const CNAMES=[["#4fb3ff","celeste"],["#9be7ff","celeste hielo"],["#1e3cff","azul"],["#ffffff","blanco"],["#ffe14d","amarillo"],["#ffd36b","dorado claro"],["#d9a845","dorado"],["#ff7a1a","naranja"],["#ff3b3b","rojo"],["#8b0000","rojo oscuro"],["#5bbf7a","verde"],["#36e0a0","verde agua"],["#b77bff","violeta"],["#ff5fd2","rosa"],["#000000","negro"]];
function colorName(hex){const h=String(hex||"#ffffff").replace("#","");const c=[0,2,4].map(k=>parseInt(h.substr(k,2),16)||0);let best="",bd=1e9;for(const[x,n]of CNAMES){const d=[1,3,5].map((k,i)=>parseInt(x.substr(k,2),16)-c[i]).reduce((s,v)=>s+v*v,0);if(d<bd){bd=d;best=n}}return L(best)}
function prompText(){
  const name=C.nombre?` (${C.nombre})`:"";
  let s=ui.ptpl?L("Te paso dos imágenes: la primera es mi personaje{0} y la segunda es una figura gris de referencia. Generá una imagen nueva del MISMO personaje de la primera imagen haciendo exactamente la pose de la figura ({1}), en el mismo lugar y tamaño que ocupa la figura.",name,ui.promptAct||L(PTPL[ui.ptpl].n).toLowerCase())
    :L("Usá la imagen adjunta como referencia de mi personaje{0}. Generá una imagen nueva del MISMO personaje {1}.",name,ui.promptAct||"…");
  s+=" "+L("Mantené exactamente la misma cara, cuerpo, ropa, tatuajes, colores y estilo de ilustración.");
  const sel=C.efectos.filter(e=>ui.promptZ&&ui.promptZ[e.id]);
  sel.forEach(e=>{const part=partName(e.parte).toLowerCase(),zn=e.n.toLowerCase(),col=e.med?colorName(e.med.pos[1]||e.med.pos[0]):colorName(e.c);
    if(ui.promptGlow==="ia")s+=" "+(part?L("Que {0} en {1} brille en color {2}.",zn,part,col):L("Que {0} brille en color {1}.",zn,col));
    else s+=" "+(part?L("Que se vea claramente {0} en {1}, bien definido y sin brillo propio (el brillo se agrega después).",zn,part):L("Que se vea claramente {0}, bien definido y sin brillo propio (el brillo se agrega después).",zn))});
  if(!ui.ptpl)s+=" "+L("Encuadre: cuerpo completo de la cabeza a los pies, centrado, ocupando casi toda la altura de la imagen, con el mismo tamaño y posición que la imagen de referencia, sin cortar ninguna parte.");
  else s+=" "+L("No copies el color gris ni el aspecto de la figura: solo su pose y su encuadre. Que no se corte ninguna parte del cuerpo.");
  s+=" "+L("Fondo blanco liso, sin sombras en el piso, sin texto ni marcos. Formato vertical 2:3.");
  return s;
}

function flatNotes(nodes=NOTES,path=[],out=[]){nodes.forEach(n=>{out.push({n,path});flatNotes(n.k||[],[...path,n],out)});return out}
function notesTree(nodes,base){
  return nodes.map(n=>{const ref=`${base}.${n.id}`,open=!!ui.open[n.id],kids=n.k||[];
    return`<div class="nd ${n.hecho&&nlook()==="lista"?"done":""}" id="nd-${n.id}"><div class="nd-h">${nlook()==="lista"?`<input type="checkbox" class="nchk" ${R(ref,"hecho","b")} ${n.hecho?"checked":""} aria-label="${L("Hecho")}">`:""}<button class="tg" data-a="tog" data-id="${n.id}">${open?"▾":"▸"}</button><button class="nt" data-a="tog" data-id="${n.id}">${esc(n.t)||"—"}</button>${(n.imgs||[]).length?`<span class="cnt">▣ ${n.imgs.length}</span>`:""}${kids.length?`<span class="cnt">${kids.length}</span>`:""}</div>
      ${open?`<div class="nd-b"><input ${R(ref,"t")} value="${esc(n.t)}" aria-label="${L("Título")}"><textarea ${R(ref,"b")} placeholder="${L("Escribí acá…")}">${esc(n.b)}</textarea>
        ${noteImgs(n,ref)}
        <div class="row"><button class="btn small" data-a="add" data-ref="${ref}.k" data-kind="nota" data-open="${n.id}">+ ${L("Agregar dentro")}</button><button class="btn small danger" data-a="delNote" data-ref="${ref}">${ui.confirm===n.id?L("¿Seguro? Tocá otra vez"):L("Borrar")}</button></div></div>
        ${kids.length?`<div class="nd-k">${notesTree(kids,ref+".k")}</div>`:""}`:""}</div>`}).join("");
}
function notesBody(){
  const q=ui.nq.trim();
  if(!q&&nlook()==="libro")return notesBook();
  if(!q)return`<div class="tree">${notesTree(NOTES,"N")||`<div class="empty">${L("Sin notas todavía.")}</div>`}</div><button class="btn" data-a="add" data-ref="N" data-kind="nota">+ ${L("Nueva carpeta o nota")}</button>`;
  const nq=norm(q),res=flatNotes().filter(({n})=>norm(n.t).includes(nq)||norm(n.b).includes(nq));
  if(!res.length)return`<div class="empty">${L("Nada encontrado para “{0}”.",esc(q))}</div>`;
  return`<p class="hint">${L("{0} resultados",res.length)}</p>`+res.map(({n,path})=>{
    let snip="";const b=n.b||"",i=norm(b).indexOf(nq);if(i>=0){const s=Math.max(0,i-60);snip=(s?"…":"")+b.slice(s,i+nq.length+80)+(i+nq.length+80<b.length?"…":"")}
    return`<button class="card" style="text-align:left" data-a="goNote" data-id="${n.id}"><span class="crumb">${path.map(p=>esc(p.t)).join(" › ")||L("Inicio")}</span><span class="t">${hlText(n.t,q)}</span>${snip?`<span class="d">${hlText(snip,q)}</span>`:""}</button>`}).join("");
}
function paneNotas(){
  return`<h2>${L("Notas")}</h2>${nlookBar()}
  <div class="search"><input id="nq" type="search" placeholder="${L("Buscar en todas las notas (ej.: Goblin celeste)")}" value="${esc(ui.nq)}" aria-label="${L("Buscar")}"></div>

}

function poseSVG(key){
  const T=PTPL[key];let j=T.j,tr="";
  if(T.rot){j=PTPL.normal.j;tr=` transform="translate(200 470) rotate(-90) scale(.62) translate(-200 -312)"`}

const rnd=n=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1}catch(e){return Math.floor(Math.random()*n)+1}};
function parseDmg(s){
  s=String(s||"");const dice=[];let rest=s.replace(/(\d*)\s*d\s*(\d+)/gi,(m,a,b)=>{dice.push([+a||1,+b]);return" "});
  let flat=0;(rest.match(/[+-]\s*\d+/g)||[]).forEach(x=>flat+=parseInt(x.replace(/\s/g,"")));
  const first=rest.trim().match(/^\d+/);if(!dice.length&&first)flat+=+first[0];
  const tipo=rest.replace(/[+-]\s*\d+/g,"").replace(/^\s*\d+/,"").trim();
  return{dice,flat,tipo};
}

function dcCompute(){
  const m=document.getElementById("modal"),D=ui.dc;if(!m.querySelector("[data-dsheet]"))return;
  const b=dcBonus(),bo=m.querySelector(".dbon");if(bo)bo.textContent=sg(b);
  const d1=num(D.d1),d2=num(D.d2);let nat=null;
  if(d1){nat=D.adv==="normal"||!d2?d1:(D.adv==="ventaja"?Math.max(d1,d2):Math.min(d1,d2))}
  const crit=nat===20,fail=nat===1;D.crit=crit;
  const ms=modSum("tirada");const total=nat?nat+b+ms.tot:null;D.total=total;D.parts=ms.parts;
  const r=m.querySelector("[data-dres]");
  if(r)r.innerHTML=nat?`<div class="dtotal ${crit?"crit":fail?"fail":""}"><span class="hint">${nat} ${sg(b)}${ms.parts.length?" "+esc(ms.parts.join(" ")):""} =</span><b>${total}</b>${crit?`<em>${L("¡Crítico!")}</em>`:fail?`<em>${L("Pifia")}</em>`:""}</div>`:`<p class="hint">${L("Escribí lo que salió en tu dado o tocá Tirar virtual.")}</p>`;
  const w=D.tab==="ataque"&&C.armas.find(x=>x.id===D.sel);const dd=m.querySelector("[data-ddres]");
  if(w&&dd){const pd=parseDmg(w.d),mode=w.crit||"doble",isC=crit&&mode!=="nada";
    let mult=isC?(mode==="triple"?3:mode==="doble"?2:mode==="custom"?Math.max(1,+w.critMult||2):1):1;const dl=m.querySelector("[data-dlabel]");
    const cm=isC&&mode==="custom"?(w.critMax||"ninguno"):isC&&mode==="max"?"todos":"ninguno";
    const groups=pd.dice.map(([n,s])=>{const tot=n*mult,mx=cm==="todos"?tot:cm==="mitad"?Math.floor(tot/2):0;return{s,roll:tot-mx,mx}});
    const diceTxt=groups.filter(g=>g.roll).map(g=>`${g.roll}d${g.s}`).join(" + ")||"—";
    const maxFixed=groups.reduce((t,g)=>t+g.mx*g.s,0);
    const maxSum=pd.dice.reduce((t,[n,s])=>t+n*s,0);
    const extra=isC&&mode==="maxmas"?maxSum:maxFixed;
    const noRoll=groups.every(g=>!g.roll)&&groups.length>0;
    if(dl)dl.textContent=noRoll?L("Daño máximo: no hace falta tirar"):(maxFixed?L("Tirá {0} y escribí la suma (+{1} fijo por máximos)",diceTxt,maxFixed):L("Tirá {0} y escribí la suma",diceTxt));
    const dr=dl&&dl.closest(".drow");if(dr){const inp=dr.querySelector("input"),bt=dr.querySelector("button");if(inp)inp.style.display=noRoll?"none":"";if(bt)bt.style.display=noRoll?"none":""}
    let tot=null;const sum=num(D.dmg);const md=modSum("daño");
    if(noRoll)tot=extra+pd.flat+md.tot;else if(sum){tot=sum+pd.flat+extra+md.tot}
    dd.innerHTML=tot!==null?`<div class="dtotal ${isC?"crit":""}"><span class="hint">${noRoll?"":sum}${extra?`${noRoll?"":" + "}${extra}`:""} ${sg(pd.flat)}${md.parts.length?" "+esc(md.parts.join(" ")):""} =</span><b>${tot}</b><em>${esc(pd.tipo)}</em></div>`+`<button class="btn small" data-q="log">${L("Anotar en el registro")}</button>`:"";
    D.tot=tot;D.diceTxt=diceTxt;D.mult=mult}
}

let SPLAY=null;
async function playSnd(id,from,to){
  if(!id)return null;const s=(C.sonidos||[]).find(x=>x.id===id);if(!s)return null;const ctx=acx();if(!ctx)return null;
  try{const b=await sndBuf(s.k);if(!b)return null;const src=ctx.createBufferSource();src.buffer=b;const g=ctx.createGain();g.gain.value=s.vol==null?1:+s.vol;src.connect(g);g.connect(ctx.destination);
    const ini=from!=null?from:(+s.ini||0),fin=to!=null?to:(+s.fin||b.duration);src.start(0,ini,Math.max(.05,fin-ini));SPLAY={src,t0:ctx.currentTime,ini,fin};return src}
  catch(e){toast(L("Este celular no puede reproducir ese audio"));return null}
}
function sfx(o,ev){if(APP.mute||!C)return;const id=(o&&o.snd)||(ev&&C.sndEv&&C.sndEv[ev]);if(id)playSnd(id)}
function sndSel(ref,f,lbl){f=f||"snd";const r=resolve(ref);const v=(r&&r.obj&&r.obj[f])||"";
  return`<div class="lbl">${L(lbl||"Sonido")}<span class="row sndrow"><select ${R(ref,f)}>${opts((C.sonidos||[]).map(s=>[s.id,s.n]),v,L("Ninguno"))}</select>${v?`<button class="btn small" data-snd="play" data-id="${v}" aria-label="${L("Escuchar")}">▶</button>`:""}<button class="btn small" data-snd="open" data-for="${ref}|${f}" title="${L("Grabar o subir un sonido")}">🎙</button></span></div>`}

/* ---- análisis ---- */
function peaks(b,n){const d=b.getChannelData(0),step=Math.max(1,Math.floor(d.length/n)),out=[];for(let i=0;i<n;i++){let m=0;for(let j=i*step;j<Math.min(d.length,(i+1)*step);j+=4){const v=Math.abs(d[j]);if(v>m)m=v}out.push(m)}return out}
function autoTrim(b){const d=b.getChannelData(0),sr=b.sampleRate;let mx=0;for(let i=0;i<d.length;i+=8)mx=Math.max(mx,Math.abs(d[i]));const th=Math.max(.02,mx*.12);
  let a=0,z=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(z>a&&Math.abs(d[z])<th)z--;
  return{ini:Math.max(0,a/sr-.04),fin:Math.min(b.duration,z/sr+.12)}}

/* ---- grabación ---- */
let REC=null;
async function recStart(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast(L("Este navegador no deja grabar. Subí un archivo de audio."));return}
  acx();
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const mr=new MediaRecorder(st);const ch=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearInterval(REC&&REC.iv);const bl=new Blob(ch,{type:mr.mimeType||"audio/mp4"});REC=null;await addSound(bl,L("Grabación {0}",(C.sonidos||[]).length+1));};
    REC={mr,t:Date.now(),iv:setInterval(()=>{const el=document.getElementById("rec-t");if(el)el.textContent=((Date.now()-REC.t)/1000).toFixed(1)+" s";if(Date.now()-REC.t>30000)recStop()},100)};
    mr.start();renderSnd()}
  catch(e){toast(L("No se pudo usar el micrófono. Revisá el permiso en los ajustes del celular."))}
}
function recStop(){if(REC&&REC.mr.state!=="inactive")REC.mr.stop()}
async function addSound(blob,name){
  if(!blob||!blob.size){toast(L("No se grabó nada"));renderSnd();return}
  if(blob.size>4e6){toast(L("El audio es muy largo (máximo unos 4 MB)"));return}
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
  const k=await putImg(url);let ini=0,fin=0;
  try{const b=await sndBuf(k);const t=autoTrim(b);ini=t.ini;fin=t.fin}catch(e){await DB.del(k);IMG.delete(k);toast(L("No se pudo leer ese audio"));renderSnd();return}
  C.sonidos=C.sonidos||[];const s={id:uid(),n:name,k,ini,fin,vol:1};C.sonidos.push(s);
  if(ui.sndFor){const[ref,f]=ui.sndFor.split("|");const r=resolve(ref);if(r&&r.obj){r.obj[f]=s.id}ui.sndFor=null}
  ui.sndEdit=s.id;saveSoon();render();renderSnd();
}

    <h3>${L("Momentos")}</h3><p class="hint">${L("Sonidos que suenan solos en estos momentos. Para armas, munición, poderes, ítems mágicos e invocaciones, elegí el sonido al editar cada uno (botón 🎙).")}</p>
    <div class="grid2">${SEV.map(([k,n])=>`<label class="lbl">${L(n)}<select ${R("C.sndEv",k)}>${opts(C.sonidos.map(s=>[s.id,s.n]),C.sndEv[k]||"",L("Ninguno"))}</select></label>`).join("")}</div></div></div>`;
  if(ed)drawWave(ed);
}
function openSnd(forRef){ui.sndOpen=true;ui.sndFor=forRef||null;ui.sndEdit=null;const m=document.getElementById("modal");m.innerHTML="";m.onclick=m.oninput=m.onchange=null;renderSnd()}
let WV=null;
async function drawWave(s){
  const cv=document.getElementById("wave");if(!cv)return;let b;try{b=await sndBuf(s.k)}catch(e){return}if(!b)return;
  const W=cv.width,H=cv.height,pk=peaks(b,W/2),ctx=cv.getContext("2d"),dur=b.duration;if(!(+s.fin))s.fin=dur;
  WV={s,b,cv,dur};
  const draw=(play)=>{ctx.clearRect(0,0,W,H);const x1=s.ini/dur*W,x2=s.fin/dur*W;
    ctx.fillStyle="rgba(217,168,69,.12)";ctx.fillRect(x1,0,x2-x1,H);
    pk.forEach((v,i)=>{const x=i*2,h=Math.max(1,v*H*.9);ctx.fillStyle=(x>=x1&&x<=x2)?"#ebe2cf":"#5a5366";ctx.fillRect(x,(H-h)/2,1.5,h)});
    ctx.fillStyle="#d9a845";[x1,x2].forEach(x=>{ctx.fillRect(x-1.5,0,3,H);ctx.beginPath();ctx.arc(x,H-8,8,0,7);ctx.fill()});
    if(play!=null){ctx.fillStyle="#4fb3ff";ctx.fillRect(play/dur*W,0,2,H)}};
  WV.draw=draw;draw();
  let drag=null;const pos=e=>{const r=cv.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*dur};
  cv.onpointerdown=e=>{const t=pos(e);drag=Math.abs(t-s.ini)<Math.abs(t-s.fin)?"ini":"fin";cv.setPointerCapture(e.pointerId);move(e)};
  const move=e=>{if(!drag)return;let t=pos(e);if(drag==="ini")s.ini=Math.min(t,s.fin-.05);else s.fin=Math.max(t,s.ini+.05);s.ini=Math.max(0,s.ini);s.fin=Math.min(dur,s.fin);draw();
    const a=document.querySelector('[data-sf="ini"]'),z=document.querySelector('[data-sf="fin"]');if(a)a.value=s.ini.toFixed(2);if(z)z.value=s.fin.toFixed(2)};
  cv.onpointermove=move;cv.onpointerup=cv.onpointercancel=()=>{if(drag){drag=null;saveSoon()}};
}
function playhead(){if(!WV||!SPLAY||!ACX)return;const t=SPLAY.ini+(ACX.currentTime-SPLAY.t0);if(t>SPLAY.fin||!document.getElementById("wave")){WV.draw&&WV.draw();return}WV.draw(t);requestAnimationFrame(playhead)}
(function(){
  document.addEventListener("click",async e=>{const b=e.target.closest("[data-snd]");if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.snd,id=b.dataset.id;
    if(k==="play"){acx();playSnd(id);return}
    if(k==="open"){const back=b.closest("[data-grim]")?"grim":null;openSnd(b.dataset.for);ui.sndBack=back;return}
    if(k==="close"){recStop();ui.sndOpen=false;ui.sndFor=null;document.getElementById("modal").innerHTML="";render();if(ui.sndBack==="grim"){ui.sndBack=null;openGrim(false)}return}
    if(k==="rec"){recStart();return}
    if(k==="stop"){recStop();return}
    if(k==="edit"){ui.sndEdit=id;renderSnd();return}
    if(k==="done"){ui.sndEdit=null;saveSoon();render();renderSnd();return}
    if(k==="assign"){const[ref,f]=ui.sndFor.split("|");const r=resolve(ref);if(r&&r.obj){snap();r.obj[f]=id;saveSoon()}ui.sndFor=null;ui.sndOpen=false;document.getElementById("modal").innerHTML="";render();toast(L("Sonido asignado"));if(ui.sndBack==="grim"){ui.sndBack=null;openGrim(false)}return}
    if(k==="del"){const s=C.sonidos.find(x=>x.id===id);if(!s)return;if(ui.sndDel!==id){ui.sndDel=id;b.textContent=L("¿Borrar?");setTimeout(()=>{ui.sndDel=null},3000);return}
      snap();C.sonidos=C.sonidos.filter(x=>x.id!==id);SBUF.delete(s.k);dropImg(s.k);if(ui.sndEdit===id)ui.sndEdit=null;saveSoon();render();renderSnd();return}
    const s=WV&&WV.s;if(!s)return;
    if(k==="prev"){acx();await playSnd(s.id);playhead();return}
    if(k==="all"){acx();await playSnd(s.id,0,WV.dur);playhead();return}
    if(k==="auto"){const t=autoTrim(WV.b);s.ini=t.ini;s.fin=t.fin;saveSoon();renderSnd();return}
  },true);
  document.addEventListener("change",e=>{const t=e.target;
    if(t.matches("[data-sndup]")){const f=t.files&&t.files[0];if(f)addSound(f,(f.name||L("Audio")).replace(/\.[^.]+$/,"").slice(0,40));return}
    if(t.matches("[data-sndmute]")){APP.mute=!t.checked;DB.set("index",APP);return}
    if(t.matches("[data-sf]")&&WV){const s=WV.s,f=t.dataset.sf;let v=parseFloat(t.value)||0;
      if(f==="ini")s.ini=clamp(v,0,s.fin-.05);if(f==="fin")s.fin=clamp(v,s.ini+.05,WV.dur);if(f==="vol")s.vol=clamp(v,0,2);saveSoon();WV.draw&&WV.draw()}});
})();

/* ---- salvaciones contra muerte ---- */
function deathCfg(){C.muerteCfg=C.muerteCfg||{ok:3,fail:3};return C.muerteCfg}
function deathIcon(st,kind,on,i){
  switch(st){
    case "velas":return IC.vela(on,kind==="ok"?"#efe6d2":"#4a4252");
    case "corazon":return kind==="ok"?IC.latido(on):IC.gota(on);
    case "reactor":return IC.celda(on,kind==="ok"?"#39ffb0":"#ff3b5c");
    case "engranajes":return IC.engr(on,kind==="ok"?"#c8893a":"#b8432a");
    case "calaveras":return kind==="ok"?IC.ancla(on,"#e0b45c"):IC.calavera(on,"#e3d6d0");
    case "runas":return IC.runa(on,kind==="ok"?"#7fe0a0":"#c08bff",i+(kind==="ok"?0:3));

  }
}
function deathHTML(){

function hpVisual(pct,tpct,tmp){
  const st=look("hp"),low=pct<=.3,P=Math.round(pct*100);
  const tmpBar=tmp?`<div class="meter tmpm" title="${L("Sobrevida")}"><i style="width:${tpct*100}%"></i></div>`:"";
  if(st==="corazon")return`<div class="hpv hheart ${low?"low":""}"><svg viewBox="0 0 64 60"><defs><clipPath id="hpc"><path d="M32 58 5 31A15 15 0 0 1 32 11a15 15 0 0 1 27 20Z"/></clipPath></defs><path d="M32 58 5 31A15 15 0 0 1 32 11a15 15 0 0 1 27 20Z" fill="#1a0a0c" stroke="#9e0b12" stroke-width="2"/><rect clip-path="url(#hpc)" x="0" y="${60-pct*50-6}" width="64" height="70" fill="#c3141f"/><path d="M14 22q4-7 10-6" stroke="#fff" stroke-opacity=".3" stroke-width="3" fill="none" stroke-linecap="round"/></svg>${low&&pct>0?`<i class="drip" style="left:48%"></i>`:""}</div>${tmpBar}`;
  if(st==="frasco")return`<div class="hpv hflask"><svg viewBox="0 0 60 64"><defs><clipPath id="fkc"><path d="M24 4h12v14q20 8 20 26a26 18 0 0 1-52 0q0-18 20-26Z"/></clipPath></defs><path d="M24 4h12v14q20 8 20 26a26 18 0 0 1-52 0q0-18 20-26Z" fill="rgba(200,220,235,.08)" stroke="#9fb3c0" stroke-width="2"/><g clip-path="url(#fkc)"><rect x="0" y="${62-pct*44}" width="60" height="64" fill="${low?"#c3141f":"#d6233a"}"/><circle class="bub" cx="22" cy="54" r="2" fill="#fff" opacity=".4"/><circle class="bub b2" cx="34" cy="56" r="1.5" fill="#fff" opacity=".4"/></g><rect x="22" y="1" width="16" height="5" rx="2" fill="#8a6440"/></svg></div>${tmpBar}`;
  if(st==="monitor"){const sp=(0.4+ (1-pct)*1.2).toFixed(2);const col=pct>.6?"#39ffb0":pct>.3?"#ffd84a":"#ff3b5c";
    return`<div class="hpv hmon" style="--c:${col};--sp:${pct>0?(2.4-1.6*(1-pct)).toFixed(2):0}s"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="${pct>0?"beat":""}" d="${pct>0?"M0 20h40l5-12 7 26 6-14h30l5-12 7 26 6-14h30l5-12 7 26 6-14h20":"M0 20H200"}" fill="none" stroke="var(--c)" stroke-width="2"/></svg><div class="segs">${Array.from({length:20},(_,i)=>`<i class="${i<Math.ceil(pct*20)?"on":""}"></i>`).join("")}</div></div>${tmpBar}`}
  if(st==="escudo")return`<div class="hpv hshield ${low?"low":""}"><svg viewBox="0 0 54 62"><defs><clipPath id="shc"><path d="M27 2 50 10v18c0 16-10 26-23 32C14 54 4 44 4 28V10Z"/></clipPath></defs><path d="M27 2 50 10v18c0 16-10 26-23 32C14 54 4 44 4 28V10Z" fill="#1a1a22" stroke="var(--gold)" stroke-width="2.5"/><rect clip-path="url(#shc)" x="0" y="${62-pct*60}" width="54" height="62" fill="var(--gold)" opacity=".85"/>${pct<.66?`<path d="M20 8l5 12-4 8 6 10" stroke="#111" stroke-width="2" fill="none"/>`:""}${pct<.33?`<path d="M38 14l-6 10 5 8-4 10" stroke="#111" stroke-width="2" fill="none"/>`:""}</svg></div>${tmpBar}`;
  return`<div class="sec" style="gap:3px"><div class="meter"><i style="width:${pct*100}%"></i></div>${tmpBar}</div>`;
}

/* ---- recursos (espacios de conjuro, ki, etc.) ---- */
function resIcons(r){
  const st=look("rec",r),c=r.c||"var(--gold)";const n=r.max;
  if(st==="pips"||n>20)return`<div class="pips">${Array.from({length:Math.min(n,20)},(_,i)=>`<span class="pip ${i>=r.act?"used":""}" style="${r.c?`background:${r.c}`:""}"></span>`).join("")}</div>`;
  const f={gemas:on=>IC.gema(on,c),llamas:on=>IC.llama(on,c),runas:(on,i)=>IC.runa(on,c,i),baterias:on=>IC.celda(on,c),calaveras:on=>IC.calavera(on,c)}[st]||(on=>IC.gema(on,c));
  return`<div class="ricons st-${st}">${Array.from({length:n},(_,i)=>`<i class="${i<r.act?"on":"used"}">${f(i<r.act,i)}</i>`).join("")}</div>`;
}

/* ============ vitrina: imagen, evoluciones, capas y aura de armas e ítems ============ */
const AURAS=[["ninguna","Sin aura"],["brillo","Brillo"],["pulso","Pulso"],["fuego","Fuego"],["hielo","Escarcha"],["sombra","Sombra"],["rayos","Rayos"],["sagrado","Sagrado"]];
function visOf(o){o.vis=o.vis||{evo:[],cur:"",capas:[],c:"#d9a845",aura:"ninguna",fondo:true};o.vis.evo=o.vis.evo||[];o.vis.capas=o.vis.capas||[];return o.vis}
function visCur(v){return v.evo.find(e=>e.id===v.cur)||v.evo[0]}
function hasVis(o){return!!(o&&o.vis&&o.vis.evo&&o.vis.evo.some(e=>e.img))}
function visStage(o,cls){
  const v=visOf(o),e=visCur(v),src=e&&getImg(e.img);
  return`<div class="vstage ${cls||""} aura-${v.aura||"ninguna"}" style="--vc:${v.c||"#d9a845"}">${src?`<img class="vbase" src="${src}" alt="">`:`<div class="vempty">${L("Sin imagen")}</div>`}
    ${v.capas.filter(c=>c.on&&c.img).map(c=>{const s=getImg(c.img);return s?`<img class="vcapa" src="${s}" alt="" style="transform:translate(${+c.x||0}%,${+c.y||0}%) scale(${c.s==null?1:c.s}) rotate(${+c.r||0}deg)">`:""}).join("")}
    ${v.aura==="rayos"?`<svg class="vbolt" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M20 10l12 22-8 4 14 26-6 3 16 25"/><path d="M78 6l-10 20 8 4-12 24 7 3-13 30"/></svg>`:""}</div>`;
}
function visThumb(o,ref){return hasVis(o)?`<button class="vthumb" data-vx="open" data-ref="${ref}" aria-label="${L("Ver {0}",esc(o.n))}">${visStage(o,"mini")}</button>`:""}
function visBtn(ref){return`<button class="btn small" data-vx="open" data-ref="${ref}">🎨 ${L("Imagen, evoluciones y capas")}</button>`}

async function fileToKey(file,max,strip){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  const im=await loadImage(url);const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");ctx.drawImage(im,0,0,w,h);if(strip)removeWhite(ctx,w,h);
  let d=cv.toDataURL("image/webp",.88);if(!d.startsWith("data:image/webp"))d=cv.toDataURL("image/png");return putImg(d);
}
function openVis(ref){const m=document.getElementById("modal");m.onclick=m.oninput=m.onchange=null;ui.vis=ref;ui.visEd=false;renderVis()}

  m.innerHTML=`<div class="dsheet" data-vism><div class="dpanel vis"><div class="row sb"><h2 style="margin:0;font-family:var(--display)">${esc(o.n)}</h2><span class="row"><button class="btn small ${ed?"on":""}" data-vx="ed">${ed?"✓ "+L("Listo"):"✎ "+L("Editar")}</button><button class="btn small" data-vx="close">✕</button></span></div>

    <div class="chips">${v.evo.map((e,i)=>`<button class="chip pose ${cur&&cur.id===e.id?"on":""}" data-vx="evo" data-id="${e.id}">${esc(e.n||L("Evolución {0}",i+1))}</button>`).join("")}
      <label class="chip add">＋ ${L("Evolución")}<input type="file" accept="image/*" data-visup="evo" hidden></label></div>
    ${ed?v.evo.map(e=>`<div class="card vrow"><input ${R(`${vr}.evo.${e.id}`,"n")} value="${esc(e.n)}" placeholder="${L("Nombre de la evolución")}"><div class="row"><label class="btn small">${L("Cambiar imagen")}<input type="file" accept="image/*" data-visup="evoimg" data-id="${e.id}" hidden></label><button class="btn small danger" data-vx="delevo" data-id="${e.id}">${ui.vdel===e.id?L("¿Seguro? Tocá otra vez"):L("Borrar")}</button></div></div>`).join(""):""}
    <h3>${L("Capas superpuestas")}</h3><p class="hint">${L("Imágenes que se ponen encima: llamas, runas, sangre, gemas engarzadas… Se prenden y apagan con un toque.")}</p>
    <div class="chips">${v.capas.map(c=>`<button class="chip tog ${c.on?"lit":""}" data-vx="capa" data-id="${c.id}" aria-pressed="${!!c.on}">${esc(c.n)}</button>`).join("")}
      <label class="chip add">＋ ${L("Capa")}<input type="file" accept="image/*" data-visup="capa" hidden></label></div>
    ${ed?v.capas.map(c=>{const cr=`${vr}.capas.${c.id}`;return`<div class="card vrow"><input ${R(cr,"n")} value="${esc(c.n)}">
      <div class="grid2"><label class="lbl">${L("Mover ↔")}<input type="range" min="-60" max="60" step="1" data-vxr="${c.id}|x" value="${+c.x||0}"></label><label class="lbl">${L("Mover ↕")}<input type="range" min="-60" max="60" step="1" data-vxr="${c.id}|y" value="${+c.y||0}"></label>
      <label class="lbl">${L("Tamaño")}<input type="range" min="0.2" max="2.5" step="0.02" data-vxr="${c.id}|s" value="${c.s==null?1:c.s}"></label><label class="lbl">${L("Girar")}<input type="range" min="-180" max="180" step="1" data-vxr="${c.id}|r" value="${+c.r||0}"></label></div>
      <div class="row"><label class="btn small">${L("Cambiar imagen")}<input type="file" accept="image/*" data-visup="capaimg" data-id="${c.id}" hidden></label><button class="btn small danger" data-vx="delcapa" data-id="${c.id}">${ui.vdel===c.id?L("¿Seguro? Tocá otra vez"):L("Borrar")}</button></div></div>`}).join(""):""}
    <h3>${L("Color y aura")}</h3>
    <div class="row"><label class="lbl inline">${L("Color")} <input type="color" ${R(vr,"c")} value="${v.c||"#d9a845"}" data-vlive></label></div>
    <div class="chips">${AURAS.map(([k,n])=>`<button class="chip ${v.aura===k?"on":""}" data-vx="aura" data-v="${k}">${L(n)}</button>`).join("")}</div>
    <label class="row hint" style="gap:6px;margin-top:8px"><input type="checkbox" ${R(vr,"fondo","b")} ${v.fondo!==false?"checked":""} style="width:auto"> ${L("Quitar el fondo blanco al subir imágenes")}</label>
  </div></div>`;
}
function visRestage(){const r=resolve(ui.vis);const w=document.getElementById("vstage-wrap");if(r&&w)w.innerHTML=visStage(r.obj,"big")}
(function(){
  document.addEventListener("click",e=>{const b=e.target.closest("[data-vx]");if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.vx;
    if(k==="open"){openVis(b.dataset.ref);return}
    const r=resolve(ui.vis);if(!r)return;const v=visOf(r.obj),id=b.dataset.id;
    if(k==="close"){ui.vis=null;document.getElementById("modal").innerHTML="";render();return}
    if(k==="ed"){ui.visEd=!ui.visEd;ui.vdel=null;render();renderVis();return}
    if(k==="evo"){v.cur=id;saveSoon();render();renderVis();return}
    if(k==="capa"){const c=v.capas.find(x=>x.id===id);c.on=!c.on;saveSoon();render();renderVis();return}
    if(k==="aura"){v.aura=b.dataset.v;saveSoon();render();renderVis();return}
    if(k==="delevo"||k==="delcapa"){if(ui.vdel!==id){ui.vdel=id;renderVis();return}snap();const arr=k==="delevo"?"evo":"capas";const x=v[arr].find(z=>z.id===id);if(x&&x.img)dropImg(x.img);v[arr]=v[arr].filter(z=>z.id!==id);if(v.cur===id)v.cur="";ui.vdel=null;saveSoon();render();renderVis();return}
  },true);
  document.addEventListener("input",e=>{const t=e.target;if(t.dataset.vxr){const[id,f]=t.dataset.vxr.split("|");const r=resolve(ui.vis);if(!r)return;const c=visOf(r.obj).capas.find(x=>x.id===id);if(c){c[f]=parseFloat(t.value);visRestage();saveSoon()}}
    else if(t.hasAttribute("data-vlive")&&ui.vis){const r=resolve(ui.vis);if(r){visOf(r.obj).c=t.value;visRestage()}}});
  document.addEventListener("change",async e=>{const t=e.target;if(t.dataset.vxr){render();return}if(!t.dataset.visup)return;const f=t.files&&t.files[0];const r=resolve(ui.vis);if(!f||!r)return;const v=visOf(r.obj),k=t.dataset.visup;
    try{const key=await fileToKey(f,900,v.fondo!==false);snap();const nm=(f.name||"").replace(/\.[^.]+$/,"").slice(0,30);
      if(k==="evo"){const e2={id:uid(),n:v.evo.length?nm||L("Evolución {0}",v.evo.length+1):L("Normal"),img:key};v.evo.push(e2);v.cur=e2.id}
      if(k==="capa"){v.capas.push({id:uid(),n:nm||L("Capa {0}",v.capas.length+1),img:key,on:true,x:0,y:0,s:1,r:0})}
      if(k==="evoimg"||k==="capaimg"){const x=v[k==="evoimg"?"evo":"capas"].find(z=>z.id===t.dataset.id);if(x){if(x.img)dropImg(x.img);x.img=key}}
      saveSoon();render();renderVis();toast(L("Imagen cargada"))}catch(err){toast(L("No se pudo leer la imagen"))}});
})();

const NLOOKS=[["base","Normal"],["libro","Libro"],["papiro","Papiro"],["lista","Lista"]];

const noteRef=(n,path)=>"N."+[...path,n].map(x=>x.id).join(".k.");
function notesBook(){
  const pages=flatNotes();const total=pages.length+1;ui.nbp=clamp(ui.nbp||0,0,total-1);const p=ui.nbp;
  const nav=`<div class="nbnav"><button class="gbtn ghost" data-a="nbp" data-v="${p-1}" ${p>0?"":"disabled"} aria-label="${L("Página anterior")}">‹</button>
    <select data-nbsel aria-label="${L("Ir a la página")}"><option value="0">${L("Índice")}</option>${pages.map(({n,path},i)=>`<option value="${i+1}" ${p===i+1?"selected":""}>${"— ".repeat(path.length)}${esc(n.t||"—")}</option>`).join("")}</select>
    <button class="gbtn ghost" data-a="nbp" data-v="${p+1}" ${p<total-1?"":"disabled"} aria-label="${L("Página siguiente")}">›</button></div>`;

    <textarea class="gin gtext" rows="12" ${R(ref,"b")} placeholder="${L("Escribí acá…")}">${esc(n.b)}</textarea>
    ${noteImgs(n,ref)}
    ${(n.k||[]).length?`<div class="gsub" style="margin-top:10px">${L("Páginas dentro")}</div><ul class="nbkids">${n.k.map(c=>{const i=pages.findIndex(x=>x.n===c);return`<li><button data-a="nbp" data-v="${i+1}">${esc(c.t||"—")}</button></li>`}).join("")}</ul>`:""}

  return`${nav}<div class="nbook"><div class="gpage">${body}<div class="gnum">${p+1}</div></div></div>${nav}`;

const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function secKey(pin,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function secSave(pin,text){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await secKey(pin,salt);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(text));C.secreto={salt:b64(salt),iv:b64(iv),ct:b64(ct)};saveSoon()}
async function secOpen(pin){const S=C.secreto;const k=await secKey(pin,ub64(S.salt));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(S.iv)},k,ub64(S.ct));return new TextDecoder().decode(pt)}

/* sonido de dados sintetizado (si no hay uno propio) */
function rattle(n,spread){const ctx=acx();if(!ctx)return;try{const t0=ctx.currentTime;for(let i=0;i<n;i++){const t=t0+Math.random()*spread;const len=.03+Math.random()*.03;const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*len),ctx.sampleRate);const d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
