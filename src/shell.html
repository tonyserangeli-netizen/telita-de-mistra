<div id="app"></div><div id="modal"></div><div class="toast" id="toast" role="status"></div>
<div id="inst" hidden style="position:fixed;left:50%;translate:-50% 0;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;gap:8px;align-items:center;background:#d9a845;color:#0d0c11;border-radius:99px;padding:6px 6px 6px 14px;font:700 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:92vw">
<span id="instTxt">Instalar Telita de Mistra</span><button id="instBtn" style="background:#0d0c11;color:#ebe2cf;border:0;border-radius:99px;padding:7px 12px;font:700 13px system-ui">Instalar</button><button id="instX" aria-label="Cerrar" style="background:none;border:0;font:700 16px system-ui;padding:4px 8px;color:#0d0c11">×</button></div>
<script>
(function(){
  var box=document.getElementById("inst"),btn=document.getElementById("instBtn"),txt=document.getElementById("instTxt"),x=document.getElementById("instX"),ev=null;
  var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone)return;
  try{if(localStorage.getItem("instX"))return}catch(e){}
  x.onclick=function(){box.hidden=true;try{localStorage.setItem("instX","1")}catch(e){}};
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;box.hidden=false});
  btn.onclick=function(){
    if(ev){ev.prompt();ev.userChoice.then(function(){box.hidden=true;ev=null})}
    else{var T=window.TL||function(s){return s};txt.textContent=T("Tocá los tres puntitos ⋮ y después “Instalar aplicación”");btn.hidden=true}
  };
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios){txt.textContent="Para instalar: tocá Compartir \u2191 y después \u201cAgregar a inicio\u201d";btn.hidden=true}
  setTimeout(function(){var T=window.TL||function(s){return s};txt.textContent=ios?T("Para instalar: tocá Compartir ↑ y después “Agregar a inicio”"):T("Instalar Telita de Mistra");btn.textContent=T("Instalar");if(!ev||ios)box.hidden=false},2500);
  window.addEventListener("appinstalled",function(){box.hidden=true});
})();
</script>
